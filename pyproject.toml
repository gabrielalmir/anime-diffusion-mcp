[project]
name = "anime-diffusion-mcp"
version = "0.2.0"
description = "MCP server for anime image generation (Animagine XL 4.0) with prompt validation and optimization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "diffusers>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "safetensors>=0.4.0",
    "peft>=0.10.0",
    "torch>=2.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_diffusion_mcp"]

[project.scripts]
anime-diffusion-mcp = "anime_diffusion_mcp.server:main"
