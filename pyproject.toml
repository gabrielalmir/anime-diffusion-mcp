[project]
name = "animagine-mcp"
version = "0.1.0"
description = "MCP server for Animagine XL 4.0 image generation with prompt validation and optimization"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "diffusers>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "safetensors>=0.4.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animagine_mcp"]

[project.scripts]
animagine-mcp = "animagine_mcp.server:main"
animagine-repl = "animagine_mcp.repl:main"
animagine-api = "animagine_mcp.api:main"
