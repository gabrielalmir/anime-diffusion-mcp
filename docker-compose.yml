services:
  animagine-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animagine-mcp-server
    runtime: nvidia

    # Ports
    ports:
      - "8000:8000"

    # GPU Support (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # Volumes
    volumes:
      # Persist model checkpoints
      - ./checkpoints:/app/checkpoints:rw
      # Persist LoRA models
      - ./loras:/app/loras:rw
      # Persist generated outputs
      - ./outputs:/app/outputs:rw
      # Cache for Hugging Face models
      - hf_cache:/root/.cache/huggingface
      # Cache for torch models
      - torch_cache:/root/.cache/torch

    # Environment variables
    environment:
      # Python settings
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      # Hugging Face settings
      HF_HOME: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch

      # GPU/CUDA settings
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_LAUNCH_BLOCKING: "1"
      TORCH_CUDA_ARCH_LIST: "7.0,7.5,8.0,8.6,8.9,9.0"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

      # Torch optimization
      TORCH_CUDNN_BENCHMARK: "1"

      # Optional: Disable telemetry
      HF_HUB_DISABLE_TELEMETRY: "1"

      # Optional: Skip model verification on startup (model is pre-downloaded in image)
      SKIP_MODEL_DOWNLOAD: "true"

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Healthcheck - verifies GPU is available
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; print(f'GPU Available: {torch.cuda.is_available()}'); print(f'GPU Count: {torch.cuda.device_count()}')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hf_cache:
    driver: local
  torch_cache:
    driver: local
